<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توليد مفتاح التفعيل</title>
<style>
  :root {
    --navy: #0B2545; --navy-2: #1D3557; --navy-3: #2a4a72;
    --yellow: #FFB703; --orange: #FB8500; --green: #0E7C5F;
    --card: #FFFFFF; --border: #E2E8F0; --muted: #64748B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif; padding: 20px;
    background:
      radial-gradient(1000px 400px at 100% -50px, rgba(255,183,3,.22), transparent 60%),
      radial-gradient(800px 500px at -100px 20%, rgba(0,119,182,.16), transparent 60%),
      linear-gradient(135deg, #0B2545 0%, #1D3557 55%, #2a4a72 120%);
  }
  .card { background: var(--card); border-radius: 18px; padding: 34px; width: 100%; max-width: 560px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  h1 { margin: 0 0 6px; font-size: 22px; color: var(--navy); }
  .sub { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
  label { display: block; font-weight: 700; margin: 12px 0 6px; font-size: 13px; color: var(--navy-2); }
  input, select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; direction: ltr; text-align: left;
  }
  input:focus, select:focus { outline: 2px solid rgba(255,183,3,.6); border-color: var(--orange); }
  button {
    margin-top: 20px; width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--orange), var(--yellow));
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .out { margin-top: 18px; display: none; }
  .out.show { display: block; }
  .key {
    background: #0B2545; color: #FFB703; border-radius: 10px; padding: 16px; font-size: 15px;
    direction: ltr; text-align: center; letter-spacing: 1.5px; word-break: break-all;
    font-family: Consolas, monospace; user-select: all;
  }
  .meta { margin-top: 8px; color: var(--green); font-weight: 700; font-size: 13px; text-align: center; }
  .err { margin-top: 14px; color: #dc3545; font-weight: 700; display: none; }
  .copy { margin-top: 10px; background: var(--navy-2); }
</style>
</head>
<body>
  <div class="card">
    <h1>🔑 توليد مفتاح التفعيل</h1>
    <div class="sub">الصق رقم التثبيت المطلوب من شاشة التفعيل بالبرنامج واختر المدة ثم اضغط توليد.</div>

    <label>رقم التثبيت (Installation ID)</label>
    <input id="installId" placeholder="SHOP-XXXXXXXXXX" autocomplete="off">

    <label>المدة (بالأيام)</label>
    <select id="days">
      <option value="30">30 يوم (شهر)</option>
      <option value="90">90 يوم (3 أشهر)</option>
      <option value="180">180 يوم (6 أشهر)</option>
      <option value="365" selected>365 يوم (سنة)</option>
      <option value="730">سنتان</option>
      <option value="3650">10 سنوات</option>
    </select>

    <label>كلمة المفتاح الرئيسي</label>
    <input id="master" type="password" placeholder="LICENSE_MASTER_KEY" autocomplete="off">

    <button id="gen">توليد المفتاح</button>
    <div class="err" id="err"></div>

    <div class="out" id="out">
      <div class="key" id="key"></div>
      <div class="meta" id="meta"></div>
      <button class="copy" id="copy">📋 نسخ</button>
    </div>
  </div>

<script>
(function () {
  var btn = document.getElementById('gen');
  var errEl = document.getElementById('err');
  var out = document.getElementById('out');
  var keyEl = document.getElementById('key');
  var metaEl = document.getElementById('meta');

  function fetchJSON(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); });
  }

  btn.addEventListener('click', function () {
    errEl.style.display = 'none';
    out.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'جاري التوليد…';
    var installId = document.getElementById('installId').value.trim();
    var days = document.getElementById('days').value;
    var master = document.getElementById('master').value;
    fetchJSON('/api/license/keygen', { installId: installId, days: days, master: master }).then(function (r) {
      btn.disabled = false;
      btn.textContent = 'توليد المفتاح';
      if (!r.ok) {
        errEl.textContent = 'خطأ: ' + r.j.error;
        errEl.style.display = 'block';
        return;
      }
      keyEl.textContent = r.j.key;
      metaEl.textContent = 'صالح حتى ' + r.j.expiry;
      out.classList.add('show');
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = 'توليد المفتاح';
      errEl.textContent = 'تعذر الاتصال بالخادم — تأكد أنه يعمل وأن صفحة keygen مفتوحة من نفس الخادم.';
      errEl.style.display = 'block';
    });
  });

  document.getElementById('copy').addEventListener('click', function () {
    var text = keyEl.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        var c = document.getElementById('copy');
        c.textContent = '✅ نُسخ';
        setTimeout(function () { c.textContent = '📋 نسخ'; }, 1500);
      });
    } else {
      keyEl.select();
      document.execCommand('copy');
    }
  });
})();
</script>
</body>
</html>
